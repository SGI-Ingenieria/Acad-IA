name: Resolve Supabase target
description: Resolves a healthy Supabase PR branch or the production project and exports its credentials.

inputs:
  branch-name:
    description: Git branch associated with the Supabase preview branch.
    required: true
  project-ref:
    description: Production project ref that owns the preview branches.
    required: false
  wait-seconds:
    description: Maximum time to wait for the Supabase branch to become healthy.
    required: false
    default: '180'
  use-production:
    description: Resolve the production project instead of waiting for a preview branch.
    required: false
    default: 'false'

outputs:
  available:
    description: Whether a healthy Supabase target was resolved.
    value: ${{ steps.resolve.outputs.available }}
  reason:
    description: Result or reason why the Supabase target was not resolved.
    value: ${{ steps.resolve.outputs.reason }}
  source:
    description: Resolved target source (preview, production, or none).
    value: ${{ steps.resolve.outputs.source }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch-name }}
        PROJECT_REF: ${{ inputs.project-ref }}
        WAIT_SECONDS: ${{ inputs.wait-seconds }}
        USE_PRODUCTION: ${{ inputs.use-production }}
      run: |
        set -uo pipefail

        echo "available=false" >> "$GITHUB_OUTPUT"
        echo "source=none" >> "$GITHUB_OUTPUT"

        if [[ "$USE_PRODUCTION" != 'true' && "$USE_PRODUCTION" != 'false' ]]; then
          echo "reason=invalid-production-mode" >> "$GITHUB_OUTPUT"
          echo "::error::use-production debe ser true o false."
          exit 1
        fi

        publish_target() {
          local target_url="$1"
          local anon_key="$2"
          local service_role_key="$3"
          local target_ref="$4"
          local target_source="$5"

          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_role_key"

          if [[ -z "$target_url" || -z "$anon_key" || -z "$service_role_key" || -z "$target_ref" ]] || \
            ! curl --fail --silent --show-error --max-time 10 \
              --header "apikey: $anon_key" \
              "$target_url/auth/v1/health" > /dev/null; then
            return 1
          fi

          if [[ "$target_source" == 'preview' ]] && \
            ! curl --fail --silent --show-error --max-time 10 \
              --header "apikey: $anon_key" \
              --header "Authorization: Bearer $anon_key" \
              "$target_url/rest/v1/roles?select=clave&limit=1" > /dev/null; then
            return 1
          fi

          {
            printf 'VITE_SUPABASE_URL=%s\n' "$target_url"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$anon_key"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_role_key"
            printf 'SUPABASE_PREVIEW_PROJECT_REF=%s\n' "$target_ref"
            echo 'ACADIA_SUPABASE_REMOTE_TESTS=1'
          } >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "source=$target_source" >> "$GITHUB_OUTPUT"
          return 0
        }

        if [[ -z "$PROJECT_REF" || -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
          echo "reason=missing-configuration" >> "$GITHUB_OUTPUT"
          echo "::notice::Supabase no esta configurado; se usara el fallback del workflow."
          exit 0
        fi

        if [[ "$USE_PRODUCTION" == 'true' ]]; then
          api_keys_json="$(mktemp)"
          cli_error="$(mktemp)"
          trap 'rm -f "$api_keys_json" "$cli_error"' EXIT

          if ! supabase projects api-keys \
            --project-ref "$PROJECT_REF" \
            --reveal \
            --output json > "$api_keys_json" 2> "$cli_error"; then
            echo "reason=production-keys-unavailable" >> "$GITHUB_OUTPUT"
            echo "::warning::No se pudieron obtener las credenciales del proyecto principal de Supabase."
            exit 0
          fi

          anon_key="$(
            jq -r \
              '[.[] | select(.name == "anon" or .type == "publishable")] | first | .api_key // empty' \
              < "$api_keys_json"
          )"
          service_role_key="$(
            jq -r \
              '[.[] | select(.name == "service_role" or .type == "secret")] | first | .api_key // empty' \
              < "$api_keys_json"
          )"
          production_url="https://$PROJECT_REF.supabase.co"

          if publish_target \
            "$production_url" \
            "$anon_key" \
            "$service_role_key" \
            "$PROJECT_REF" \
            'production'; then
            echo "reason=resolved-production" >> "$GITHUB_OUTPUT"
            echo "Proyecto principal de Supabase listo para las pruebas."
          else
            echo "reason=production-unhealthy" >> "$GITHUB_OUTPUT"
            echo "::warning::El proyecto principal de Supabase no respondio correctamente."
          fi
          exit 0
        fi

        if [[ -z "$BRANCH_NAME" ]]; then
          echo "reason=missing-branch-name" >> "$GITHUB_OUTPUT"
          echo "::notice::No hay una branch de Git que se pueda resolver en Supabase."
          exit 0
        fi

        if [[ ! "$WAIT_SECONDS" =~ ^[0-9]+$ ]]; then
          echo "reason=invalid-wait" >> "$GITHUB_OUTPUT"
          echo "::error::wait-seconds debe ser un entero no negativo."
          exit 1
        fi

        branch_environment="$(mktemp)"
        branches_json="$(mktemp)"
        cli_error="$(mktemp)"
        trap 'rm -f "$branch_environment" "$branches_json" "$cli_error"' EXIT
        deadline=$((SECONDS + WAIT_SECONDS))
        branch_seen=0
        api_failures=0

        while (( SECONDS <= deadline )); do
          if ! supabase branches list \
            --project-ref "$PROJECT_REF" \
            -o json > "$branches_json" 2> "$cli_error"; then
            api_failures=$((api_failures + 1))
            if (( api_failures >= 3 )); then
              echo "reason=management-api-error" >> "$GITHUB_OUTPUT"
              echo "::warning::No se pudo consultar Supabase Branching con las credenciales configuradas."
              exit 0
            fi
          else
            api_failures=0
            branch_record="$(
              jq -c --arg branch "$BRANCH_NAME" \
                '[.[] | select(.git_branch == $branch or .name == $branch)] | first // empty' \
                < "$branches_json"
            )"

            if [[ -n "$branch_record" ]]; then
              branch_seen=1
              branch_status="$(jq -r '.status // ""' <<< "$branch_record")"
              preview_status="$(jq -r '.preview_project_status // ""' <<< "$branch_record")"

              if [[ "$branch_status" == *FAILED* || "$branch_status" == *ERROR* || "$preview_status" == *FAILED* || "$preview_status" == *ERROR* ]]; then
                echo "reason=branch-failed" >> "$GITHUB_OUTPUT"
                echo "::warning::La branch Supabase $BRANCH_NAME termino en un estado fallido."
                exit 0
              fi

              if [[ "$branch_status" == "FUNCTIONS_DEPLOYED" && "$preview_status" == "ACTIVE_HEALTHY" ]]; then
                if supabase branches get "$BRANCH_NAME" \
                  --project-ref "$PROJECT_REF" \
                  -o env > "$branch_environment" 2> "$cli_error"; then
                  set -a
                  # shellcheck disable=SC1090
                  source "$branch_environment"
                  set +a

                  if [[ -n "${SUPABASE_URL:-}" && -n "${SUPABASE_ANON_KEY:-}" && -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
                    preview_project_ref="${SUPABASE_URL#https://}"
                    preview_project_ref="${preview_project_ref%%.*}"

                    if publish_target \
                      "$SUPABASE_URL" \
                      "$SUPABASE_ANON_KEY" \
                      "$SUPABASE_SERVICE_ROLE_KEY" \
                      "$preview_project_ref" \
                      'preview'; then
                      echo "reason=resolved-preview" >> "$GITHUB_OUTPUT"
                      echo "Supabase preview listo para $BRANCH_NAME."
                      exit 0
                    fi
                  fi
                fi
              fi
            fi
          fi

          if (( SECONDS + 5 > deadline )); then
            break
          fi
          sleep 5
        done

        if [[ "$branch_seen" == '0' ]]; then
          echo "reason=branch-not-found" >> "$GITHUB_OUTPUT"
          echo "::notice::No aparecio una branch Supabase para $BRANCH_NAME en ${WAIT_SECONDS}s."
        else
          echo "reason=branch-not-ready" >> "$GITHUB_OUTPUT"
          echo "::notice::La branch Supabase de $BRANCH_NAME no quedo utilizable en ${WAIT_SECONDS}s."
        fi

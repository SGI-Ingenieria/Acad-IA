name: Android native preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/android*.ts'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Install the current Android SDK
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'cmdline-tools;latest' 'platforms;android-37.2' 'build-tools;37.0.0' 'platform-tools'
      - name: Compile and verify without backend credentials
        run: bash android/gradlew -p android :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: android-verification
          path: android/app/build/reports/
          retention-days: 7

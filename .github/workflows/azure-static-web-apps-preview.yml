name: Azure Static Web Apps Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

concurrency:
  # Shared with the close workflow so closing a PR cancels its in-flight upload first.
  group: azure-static-web-apps-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy_preview:
    name: Deploy preview with selected Supabase
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: preview
    concurrency:
      group: supabase-preview-state-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      AZURE_PREVIEW_URL: https://victorious-bay-0ca0aae10-${{ github.event.pull_request.number }}.centralus.3.azurestaticapps.net

    steps:
      # Run privileged branch-management actions from the trusted base revision.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Detect Supabase changes
        id: supabase-changes
        uses: ./.github/actions/detect-supabase-changes
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: supabase/setup-cli@v3
        if: steps.supabase-changes.outputs.changed == 'true'
        with:
          version: 2.115.0

      - name: Activate Supabase preview branch
        if: steps.supabase-changes.outputs.changed == 'true'
        uses: ./.github/actions/manage-supabase-preview
        with:
          branch-name: ${{ github.event.pull_request.head.ref }}
          project-ref: ${{ secrets.SUPABASE_PROJECT_REF }}
          target-state: active
          wait-seconds: '1200'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Resolve Supabase preview branch
        id: supabase-preview
        if: steps.supabase-changes.outputs.changed == 'true'
        uses: ./.github/actions/resolve-supabase-preview
        with:
          branch-name: ${{ github.head_ref }}
          project-ref: ${{ secrets.SUPABASE_PROJECT_REF }}
          wait-seconds: '300'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Stage trusted function secret synchronizer
        if: steps.supabase-changes.outputs.changed == 'true'
        shell: bash
        run: |
          install -m 0700 deploy/scripts/sync-hosted-function-secrets.sh \
            "$RUNNER_TEMP/sync-hosted-function-secrets.sh"

      # Build the application from the pull request after privileged setup.
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Use hosted QA Supabase
        id: hosted_qa_supabase
        if: steps.supabase-changes.outputs.changed != 'true'
        env:
          HOSTED_QA_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          HOSTED_QA_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          HOSTED_QA_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail

          hosted_qa_url="${HOSTED_QA_SUPABASE_URL%/}"
          expected_url="https://$HOSTED_QA_PROJECT_REF.supabase.co"
          if [[ -z "$HOSTED_QA_PROJECT_REF" || -z "$HOSTED_QA_SUPABASE_ANON_KEY" || "$hosted_qa_url" != "$expected_url" ]]; then
            echo "::error::Las variables públicas no corresponden al proyecto hospedado de QA."
            exit 1
          fi

          echo "::add-mask::$HOSTED_QA_SUPABASE_ANON_KEY"
          curl --fail --silent --show-error --max-time 10 \
            --header "apikey: $HOSTED_QA_SUPABASE_ANON_KEY" \
            "$hosted_qa_url/auth/v1/health" > /dev/null

          {
            printf 'VITE_SUPABASE_URL=%s\n' "$hosted_qa_url"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$HOSTED_QA_SUPABASE_ANON_KEY"
            printf 'SUPABASE_PREVIEW_PROJECT_REF=%s\n' "$HOSTED_QA_PROJECT_REF"
          } >> "$GITHUB_ENV"
          echo 'available=true' >> "$GITHUB_OUTPUT"
          echo 'source=hosted-qa' >> "$GITHUB_OUTPUT"
          echo 'Proyecto hospedado de QA seleccionado para el preview.'

      - name: Select Supabase target
        id: supabase-target
        env:
          SUPABASE_CHANGED: ${{ steps.supabase-changes.outputs.changed }}
          PREVIEW_AVAILABLE: ${{ steps.supabase-preview.outputs.available }}
          PREVIEW_REASON: ${{ steps.supabase-preview.outputs.reason }}
          HOSTED_QA_AVAILABLE: ${{ steps.hosted_qa_supabase.outputs.available }}
        shell: bash
        run: |
          if [[ "$SUPABASE_CHANGED" == 'true' ]]; then
            {
              echo "available=${PREVIEW_AVAILABLE:-false}"
              echo 'source=preview'
              echo "reason=${PREVIEW_REASON:-preview-unavailable}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "available=${HOSTED_QA_AVAILABLE:-false}"
              echo 'source=hosted-qa'
              echo 'reason=resolved-hosted-qa'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Configure preview function secrets
        if: steps.supabase-target.outputs.available == 'true' && steps.supabase-target.outputs.source == 'preview'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AI_RECOVERY_CRON_PUBLISHABLE_KEY: ${{ secrets.AI_RECOVERY_CRON_PUBLISHABLE_KEY }}
          AI_RECOVERY_CRON_SECRET: ${{ secrets.AI_RECOVERY_CRON_SECRET }}
          AZURE_DOCUMENT_LAYOUT_ENABLED: ${{ secrets.AZURE_DOCUMENT_LAYOUT_ENABLED }}
          AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT }}
          AZURE_DOCUMENT_INTELLIGENCE_KEY: ${{ secrets.AZURE_DOCUMENT_INTELLIGENCE_KEY }}
          CARBONE_API_TOKEN: ${{ secrets.CARBONE_API_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          INTERNAL_AUTH_PEPPER: ${{ secrets.INTERNAL_AUTH_PEPPER }}
          INTERNAL_AUTH_SECRET: ${{ secrets.INTERNAL_AUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}
          OPENAI_WEBHOOK_SECRET: ${{ secrets.OPENAI_WEBHOOK_SECRET }}
          SGU_NTLM_URL: ${{ secrets.SGU_NTLM_URL }}
          USER_CREATION_MASTER_PASSWORD: ${{ secrets.USER_CREATION_MASTER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          openai_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 15 \
              --header "Authorization: Bearer $OPENAI_API_KEY" \
              --header "OpenAI-Project: $OPENAI_PROJECT_ID" \
              https://api.openai.com/v1/models
          )"
          if [[ "$openai_status" != '200' ]]; then
            echo "::error::OPENAI_API_KEY y OPENAI_PROJECT_ID no son compatibles (HTTP $openai_status)."
            exit 1
          fi

          azure_document_endpoint="${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT%/}"
          azure_document_status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 15 \
              --header "Ocp-Apim-Subscription-Key: $AZURE_DOCUMENT_INTELLIGENCE_KEY" \
              "$azure_document_endpoint/documentintelligence/documentModels?api-version=2024-11-30"
          )"
          if [[ "$azure_document_status" != '200' ]]; then
            echo "::error::Azure Document Intelligence no aceptó la configuración (HTTP $azure_document_status)."
            exit 1
          fi

          bash "$RUNNER_TEMP/sync-hosted-function-secrets.sh" \
            "$SUPABASE_PREVIEW_PROJECT_REF" "$AZURE_PREVIEW_URL"

      # A draft preview is paused while synchronize events keep advancing the
      # PR. Reconcile the accumulated Supabase changes after it becomes active.
      - name: Reconcile Supabase preview after draft
        if: >-
          github.event.action == 'ready_for_review' &&
          steps.supabase-target.outputs.available == 'true' &&
          steps.supabase-target.outputs.source == 'preview' &&
          steps.supabase-changes.outputs.reconcile == 'true'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PARENT_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          branch_environment="$(mktemp)"
          trap 'rm -f "$branch_environment"' EXIT

          supabase branches get "$BRANCH_NAME" \
            --project-ref "$PARENT_PROJECT_REF" \
            --output env > "$branch_environment"
          set -a
          # shellcheck disable=SC1090
          source "$branch_environment"
          set +a

          : "${SUPABASE_URL:?Supabase preview API URL was not resolved}"
          : "${SUPABASE_PREVIEW_PROJECT_REF:?Supabase preview project ref was not selected}"
          preview_database_url="${POSTGRES_URL_NON_POOLING:-${POSTGRES_URL:-}}"
          resolved_project_ref="${SUPABASE_URL#https://}"
          resolved_project_ref="${resolved_project_ref%%.*}"
          : "${preview_database_url:?Supabase preview database URL was not resolved}"
          if [[ "$resolved_project_ref" != "$SUPABASE_PREVIEW_PROJECT_REF" ]]; then
            echo '::error::Las credenciales resueltas no pertenecen a la branch preview seleccionada.'
            exit 1
          fi
          echo "::add-mask::$preview_database_url"

          supabase db push \
            --db-url "$preview_database_url" \
            --include-all \
            --yes
          psql "$preview_database_url" \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --file supabase/seed.stage.sql
          supabase functions deploy \
            --project-ref "$SUPABASE_PREVIEW_PROJECT_REF" \
            --use-api

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build preview
        if: steps.supabase-target.outputs.available == 'true'
        run: bunx --bun vite build

      - name: Deploy Azure preview
        id: deploy-preview
        if: steps.supabase-target.outputs.available == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          # El router de webhooks se despliega sólo en Production. Incluir el
          # API aquí copiaría sus secretos de Azure a código ejecutado por PRs.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true

      - name: Verify deployed preview uses the selected Supabase
        if: steps.supabase-target.outputs.available == 'true'
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.static_web_app_url || env.AZURE_PREVIEW_URL }}
        shell: bash
        run: |
          set -euo pipefail

          preview_url="${PREVIEW_URL%/}"
          expected_host="$SUPABASE_PREVIEW_PROJECT_REF.supabase.co"
          html_file="$(mktemp)"
          asset_file="$(mktemp)"
          trap 'rm -f "$html_file" "$asset_file"' EXIT

          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 15 \
              "$preview_url/?commit=$GITHUB_SHA" > "$html_file"; then
              mapfile -t assets < <(
                grep -oE 'src="[^"]+\.js"' "$html_file" |
                  sed -E 's/^src="|"$//g'
              )

              for asset in "${assets[@]}"; do
                if [[ "$asset" =~ ^https:// ]]; then
                  asset_url="$asset"
                elif [[ "$asset" == /* ]]; then
                  asset_url="$preview_url$asset"
                else
                  asset_url="$preview_url/$asset"
                fi

                if curl --fail --silent --show-error --location --max-time 15 \
                  "$asset_url" > "$asset_file" &&
                  grep --fixed-strings --quiet "$expected_host" "$asset_file"; then
                  echo "Azure sirve el frontend conectado a $SUPABASE_PREVIEW_PROJECT_REF (${{ steps.supabase-target.outputs.source }})."
                  exit 0
                fi
              done
            fi

            if (( attempt < 12 )); then
              sleep 5
            fi
          done

          echo "::error::Azure no sirvio un bundle conectado a $SUPABASE_PREVIEW_PROJECT_REF."
          exit 1

      - name: Publish Azure preview comment
        if: steps.supabase-target.outputs.available == 'true'
        uses: ./.github/actions/update-azure-preview-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          state: ready
          preview-url: ${{ steps.deploy-preview.outputs.static_web_app_url || env.AZURE_PREVIEW_URL }}
          preview-project-ref: ${{ env.SUPABASE_PREVIEW_PROJECT_REF }}
          supabase-source: ${{ steps.supabase-target.outputs.source }}
          commit-sha: ${{ github.event.pull_request.head.sha }}
          run-url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Close stale Azure preview
        if: steps.supabase-changes.outputs.changed == 'true' && steps.supabase-target.outputs.available != 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}
          app_location: '/'
          action: close

      - name: Report unavailable Supabase branch
        if: steps.supabase-changes.outputs.changed == 'true' && steps.supabase-target.outputs.available != 'true'
        env:
          REASON: ${{ steps.supabase-target.outputs.reason }}
        run: |
          {
            echo '### Azure preview omitido'
            echo
            echo "Supabase no entrego una branch sana para este commit (motivo: \`$REASON\`)."
            echo 'No se desplego el frontend contra produccion.'
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy to Azure Static Web Apps

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Commit whose frontend will be published after backend reconciliation
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_PRODUCTION_URL: https://victorious-bay-0ca0aae10.3.azurestaticapps.net

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Build against the production AKS backend
        env:
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          AKS_BACKEND_HOST: ${{ vars.AKS_BACKEND_HOST }}
        shell: bash
        run: |
          work_dir="$(mktemp -d)"
          chmod 700 "$work_dir"
          trap 'rm -rf "$work_dir"' EXIT
          az keyvault secret download \
            --vault-name "$AZURE_KEY_VAULT_NAME" \
            --name supabase-publishable-key \
            --file "$work_dir/publishable-key" \
            --encoding utf-8 \
            --output none \
            --only-show-errors
          export VITE_SUPABASE_URL="https://${AKS_BACKEND_HOST}"
          VITE_SUPABASE_ANON_KEY="$(<"$work_dir/publishable-key")"
          export VITE_SUPABASE_ANON_KEY
          bunx --bun vite build

      - name: Deploy frontend and managed webhook API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ''
          skip_app_build: true

      - name: Verify managed OpenAI webhook router
        shell: bash
        run: |
          set -euo pipefail

          router_url="${AZURE_PRODUCTION_URL%/}/api/openai-webhook"
          router_status='000'
          for attempt in {1..12}; do
            router_status="$(
              curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --max-time 15 \
                --request POST \
                --header 'Content-Type: application/json' \
                --data '{}' \
                "$router_url" || true
            )"

            # An unsigned request must be rejected by the initialized router.
            if [[ "$router_status" == '400' ]]; then
              echo 'Azure managed Functions loaded the OpenAI webhook router.'
              exit 0
            fi

            if (( attempt < 12 )); then
              sleep 5
            fi
          done

          echo "::error::El router central de webhooks no esta sano (HTTP $router_status)."
          exit 1

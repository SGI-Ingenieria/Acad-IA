name: Publish backend configuration to Vaultwarden

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH to copy the current Key Vault values to Vaultwarden
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-vaultwarden-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Key Vault snapshot
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Validate explicit confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != 'PUBLISH' ]]; then
            echo '::error::This workflow requires confirmation PUBLISH.'
            exit 1
          fi

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned Bitwarden CLI
        run: npm install --global @bitwarden/cli@2026.8.0

      - name: Publish backend configuration
        env:
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          BW_SERVER_URL: ${{ vars.BW_SERVER_URL }}
          BW_ITEM_ID: ${{ vars.BW_ITEM_ID }}
          BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
          BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}
          BW_PASSWORD: ${{ secrets.BW_PASSWORD }}
        run: bash deploy/scripts/publish-key-vault-to-vaultwarden.sh

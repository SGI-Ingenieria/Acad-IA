name: Rotate backend secrets

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Secret group to rotate
        required: true
        default: safe
        type: choice
        options:
          - safe
          - api-keys
          - dashboard
          - application
          - identity
      confirmation:
        description: Type ROTATE, ROTATE_APPLICATION, or ROTATE_IDENTITY as required
        required: true
        type: string
      publish_to_vaultwarden:
        description: Publish the resulting Key Vault values to the configured Vaultwarden item
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: production-secret-rotation
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate ${{ inputs.scope }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Validate explicit confirmation
        env:
          SCOPE: ${{ inputs.scope }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          expected=ROTATE
          [[ "$SCOPE" == 'application' ]] && expected=ROTATE_APPLICATION
          [[ "$SCOPE" == 'identity' ]] && expected=ROTATE_IDENTITY
          if [[ "$CONFIRMATION" != "$expected" ]]; then
            echo "::error::The selected scope requires confirmation $expected."
            exit 1
          fi

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/use-kubelogin@v1.3
        with:
          kubelogin-version: v0.2.19

      - uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          use-kubelogin: 'true'

      - name: Rotate in Key Vault and synchronize AKS
        env:
          SCOPE: ${{ inputs.scope }}
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          AKS_NAMESPACE: ${{ vars.AKS_NAMESPACE }}
        shell: bash
        run: |
          work_dir="$(mktemp -d)"
          chmod 700 "$work_dir"
          trap 'rm -rf "$work_dir"' EXIT
          source deploy/scripts/key-vault-secrets.sh

          generator_args=("$SCOPE" "$work_dir/rotation.json")
          if [[ "$SCOPE" == 'identity' ]]; then
            az keyvault secret download \
              --vault-name "$AZURE_KEY_VAULT_NAME" \
              --name jwt-secret \
              --file "$work_dir/jwt-secret" \
              --encoding utf-8 \
              --output none \
              --only-show-errors
            chmod 600 "$work_dir/jwt-secret"
            generator_args+=("$work_dir/jwt-secret")
          fi

          node deploy/scripts/generate-supabase-secrets.mjs "${generator_args[@]}"
          store_json_secrets "$work_dir/rotation.json" "$work_dir"
          download_kubernetes_secret "$work_dir"
          bash deploy/scripts/sync-ai-recovery-vault.sh

          case "$SCOPE" in
            safe|api-keys)
              deployments=(supabase-envoy supabase-studio acad-ia-functions)
              ;;
            dashboard)
              deployments=(supabase-envoy)
              ;;
            application)
              deployments=(acad-ia-functions)
              ;;
            identity)
              deployments=(
                supabase-envoy supabase-auth supabase-rest supabase-realtime
                acad-ia-storage acad-ia-functions supabase-studio supabase-pooler
              )
              ;;
          esac

          for deployment in "${deployments[@]}"; do
            kubectl --namespace "$AKS_NAMESPACE" rollout restart "deployment/$deployment"
          done
          for deployment in "${deployments[@]}"; do
            kubectl --namespace "$AKS_NAMESPACE" rollout status \
              "deployment/$deployment" --timeout=10m
          done

      - name: Rebuild frontend with the current publishable key
        if: inputs.scope == 'safe' || inputs.scope == 'api-keys' || inputs.scope == 'identity'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run azure-static-web-apps-production.yml --ref main

  publish_vaultwarden:
    name: Publish rotated values to Vaultwarden
    needs: rotate
    if: inputs.publish_to_vaultwarden
    uses: ./.github/workflows/publish-backend-secrets-vaultwarden.yml
    secrets: inherit

name: Pause Supabase Preview for Drafts

on:
  pull_request:
    types: [opened, reopened, synchronize, converted_to_draft]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  pause_preview:
    name: Pause automatically provisioned branch
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    concurrency:
      group: supabase-preview-state-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Detect Supabase changes
        id: supabase-changes
        uses: ./.github/actions/detect-supabase-changes
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: supabase/setup-cli@v3
        if: steps.supabase-changes.outputs.changed == 'true'
        with:
          version: 2.115.0

      - name: Wait for automatic provisioning and pause branch
        if: steps.supabase-changes.outputs.changed == 'true'
        uses: ./.github/actions/manage-supabase-preview
        with:
          branch-name: ${{ github.event.pull_request.head.ref }}
          project-ref: ${{ secrets.SUPABASE_PROJECT_REF }}
          target-state: paused
          wait-seconds: '1200'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

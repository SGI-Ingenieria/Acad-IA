name: Export linked Supabase snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - name: Crear respaldo y tipos
        run: |
          mkdir -p .ci-artifacts
          supabase db dump --linked --data-only -f .ci-artifacts/database-data.sql
          supabase gen types typescript --linked --schema public > .ci-artifacts/database.types.ts
      - name: Publicar respaldo
        uses: actions/upload-artifact@v7
        with:
          name: supabase-backup-${{ github.sha }}
          path: .ci-artifacts/
          retention-days: 14
          if-no-files-found: error

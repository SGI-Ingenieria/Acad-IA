name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Supabase changes
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.supabase.outputs.changed }}

    steps:
      - uses: actions/checkout@v7

      - name: Determine whether Supabase changed
        id: supabase
        uses: ./.github/actions/detect-supabase-changes
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend Bun tests
    needs: changes
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: local-anon-key

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Design spacing contract
        run: bun run design:spacing

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Azure Functions API tests
        run: bun run test:api

      - name: Validate production Supabase frontend variables
        if: needs.changes.outputs.supabase != 'true'
        env:
          PRODUCTION_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          PRODUCTION_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          if [[ ! "$PRODUCTION_SUPABASE_URL" =~ ^https://[a-z0-9]{20}\.supabase\.co/?$ || -z "$PRODUCTION_SUPABASE_ANON_KEY" ]]; then
            echo '::error::Faltan las variables publicas del Supabase principal para compilar el frontend.'
            exit 1
          fi
          echo "::add-mask::$PRODUCTION_SUPABASE_ANON_KEY"

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ needs.changes.outputs.supabase != 'true' && vars.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          VITE_SUPABASE_ANON_KEY: ${{ needs.changes.outputs.supabase != 'true' && vars.VITE_SUPABASE_ANON_KEY || 'local-anon-key' }}
        run: bun run build

  database:
    name: Supabase database tests
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Start local database
        run: supabase db start

      - name: Reset local database with seed
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db

  edge-functions:
    name: Supabase Edge Function unit tests
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Run Deno unit tests
        run: deno test --node-modules-dir=none --allow-env --allow-read --allow-sys=umask supabase/functions/tests/unit

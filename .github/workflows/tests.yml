name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Bun tests
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: local-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Design spacing contract
        run: bun run design:spacing

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

  visual:
    name: Visual spacing regression
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase stack
        run: supabase start

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Compare visual surfaces
        run: bun run test:visual

      - name: Upload visual report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-spacing-report
          path: |
            playwright-report/
            test-results/visual/
          retention-days: 14
          if-no-files-found: ignore

  database:
    name: Supabase database tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local database
        run: supabase db start

      - name: Reset local database with seed
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db

  edge-functions:
    name: Supabase Edge Function unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Run Deno unit tests
        run: deno test --node-modules-dir=none --allow-env --allow-read --allow-sys=umask supabase/functions/tests/unit

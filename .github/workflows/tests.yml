name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Supabase changes
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.supabase.outputs.changed }}

    steps:
      - name: Determine whether Supabase changed
        id: supabase
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName !== 'pull_request') {
              core.info('Manual run: Supabase tests are enabled.')
              core.setOutput('changed', 'true')
              return
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            })
            const touchesSupabase = (path) => path?.startsWith('supabase/')
            const matchingFiles = files.filter(
              (file) =>
                touchesSupabase(file.filename) ||
                touchesSupabase(file.previous_filename),
            )
            const changed = matchingFiles.length > 0

            core.info(
              changed
                ? `Supabase tests enabled by: ${matchingFiles
                    .map((file) => file.filename)
                    .join(', ')}`
                : 'Supabase tests skipped: this pull request does not change supabase/.',
            )
            core.setOutput('changed', String(changed))

  frontend:
    name: Frontend Bun tests
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: local-anon-key

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Design spacing contract
        run: bun run design:spacing

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

  database:
    name: Supabase database tests
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Start local database
        run: supabase db start

      - name: Reset local database with seed
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db

  edge-functions:
    name: Supabase Edge Function unit tests
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Run Deno unit tests
        run: deno test --node-modules-dir=none --allow-env --allow-read --allow-sys=umask supabase/functions/tests/unit

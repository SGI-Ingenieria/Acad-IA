name: Visual Regression

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/visual-tests.yml
      - src/**
      - public/**
      - tests/visual/**
      - scripts/run-visual-tests.ts
      - scripts/update-linux-visual-snapshots.ts
      - playwright.config.ts
      - vite.config.*
      - index.html
      - package.json
      - bun.lock
      - supabase/config.toml
      - supabase/migrations/**
      - supabase/seed.sql
      - supabase/seed.stage.sql
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    name: Visual spacing regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium-headless-shell

      - name: Install Chromium system dependencies
        run: bunx playwright install-deps chromium

      - name: Install Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: bunx playwright install --only-shell chromium

      - name: Start local Supabase stack
        run: bunx supabase start

      - name: Compare visual surfaces
        run: bun run test:visual

      - name: Upload visual report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-spacing-report
          path: |
            playwright-report/
            test-results/visual/
          retention-days: 14
          if-no-files-found: ignore

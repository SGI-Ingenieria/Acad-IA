name: Visual Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  visual:
    name: Visual spacing regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Detect Supabase changes
        id: supabase-changes
        uses: ./.github/actions/detect-supabase-changes
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium-headless-shell

      - name: Install Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: bunx playwright install --only-shell chromium

      - name: Resolve Supabase test target
        id: supabase-preview
        uses: ./.github/actions/resolve-supabase-preview
        with:
          branch-name: ${{ github.head_ref || github.ref_name }}
          project-ref: ${{ secrets.SUPABASE_PROJECT_REF }}
          wait-seconds: '180'
          use-production: ${{ github.event_name != 'pull_request' || steps.supabase-changes.outputs.changed != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Report selected Supabase test target
        if: steps.supabase-preview.outputs.available == 'true'
        env:
          TARGET_SOURCE: ${{ steps.supabase-preview.outputs.source }}
        run: echo "Las pruebas visuales usaran Supabase $TARGET_SOURCE."

      - name: Require production Supabase
        if: (github.event_name != 'pull_request' || steps.supabase-changes.outputs.changed != 'true') && steps.supabase-preview.outputs.available != 'true'
        env:
          REASON: ${{ steps.supabase-preview.outputs.reason }}
        run: |
          echo "::error::No se pudo conectar al Supabase principal ($REASON)."
          exit 1

      - name: Start local Supabase stack
        if: github.event_name == 'pull_request' && steps.supabase-changes.outputs.changed == 'true' && steps.supabase-preview.outputs.available != 'true'
        run: supabase start

      - name: Compare visual surfaces
        # Cobertura por pares: ambos viewports y ambos temas sin cuadruplicar
        # cada escenario. La matriz completa sigue disponible de forma manual.
        run: >-
          bun run test:visual --
          --project=desktop-light
          --project=mobile-dark

      - name: Upload visual report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-spacing-report
          path: |
            playwright-report/
            test-results/visual/
          retention-days: 14
          if-no-files-found: ignore

name: supabase

services:
  frontend:
    container_name: acadia-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${ANON_KEY}}
    restart: unless-stopped
    depends_on:
      api-gw:
        condition: service_healthy
    expose:
      - '80'
